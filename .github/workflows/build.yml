name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Verificar archivos
        run: |
          pwd
          ls -la

      - name: Compilar APK
        id: compilar
        continue-on-error: true
        run: |
          (yes | buildozer android debug) > build.log 2>&1

      - name: Mostrar error si falló
        if: steps.compilar.outcome == 'failure'
        run: |
          echo "===== CONTEXTO ANTES DE 'gradlew failed' ====="
          linea=$(grep -n "gradlew failed" build.log | tail -1 | cut -d: -f1)
          if [ -z "$linea" ]; then
            echo "No se encontró 'gradlew failed', mostrando últimas 200 líneas:"
            tail -n 200 build.log
          else
            inicio=$((linea - 150))
            if [ $inicio -lt 1 ]; then inicio=1; fi
            sed -n "${inicio},${linea}p" build.log
          fi
          exit 1

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: damas-apk
          path: bin/*.apk
